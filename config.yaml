# Single source of truth for the study. Scripts read everything from here.

llama_cpp:
  dir: llama.cpp                 # symlink to the checkout (gitignored)
  build: llama.cpp/build-sycl
  commit: bed0a856606ee4a24a164066f73d2379447033f5
  backend: sycl
  oneapi_setvars: /opt/intel/oneapi/setvars.sh
  device: "level_zero:0"         # ONEAPI_DEVICE_SELECTOR; override with --device

server:
  port: 18080
  args: [--ctx-size, "8192", --n-gpu-layers, "999", --parallel, "1",
         --batch-size, "2048", --ubatch-size, "512",
         --cache-type-k, f16, --cache-type-v, f16, --flash-attn, "off",
         --seed, "42", --reasoning, "off", --cache-ram, "0", --no-webui]

request:
  temperature: 0
  top_k: 1
  top_p: 1.0
  min_p: 0
  repeat_penalty: 1.0
  presence_penalty: 0
  frequency_penalty: 0
  dry_multiplier: 0
  cache_prompt: false
  seed: 42

chat_template_kwargs:
  enable_thinking: false

seed: 20261027                   # inputs (random strings) are generated from this

calibration:
  source: llama.cpp/wikitext-2-raw/wiki.train.raw
  max_chars: 600000
  chunks: 200
  ctx: 512

# Variant sources:
#   hf        download `file` from the model's hf_repo, test, delete
#   quantize  llama-quantize from the reference GGUF; imatrix: none | own | unsloth
models:
  qwen3.5-4b:
    hf_repo: unsloth/Qwen3.5-4B-GGUF
    reference: BF16
    unsloth_imatrix: imatrix_unsloth.gguf_file
    variants:
      - {name: BF16,           group: reference, source: hf, file: Qwen3.5-4B-BF16.gguf}

      # DIY ladder, no imatrix (H1)
      - {name: Q8_0,           group: ladder,  source: quantize, type: Q8_0}
      - {name: Q6_K,           group: ladder,  source: quantize, type: Q6_K}
      - {name: Q5_K_M,         group: ladder,  source: quantize, type: Q5_K_M}
      - {name: Q4_K_M,         group: ladder,  source: quantize, type: Q4_K_M}
      - {name: Q3_K_M,         group: ladder,  source: quantize, type: Q3_K_M}
      - {name: Q2_K,           group: ladder,  source: quantize, type: Q2_K}
      # scheme contrast (H4)
      - {name: Q4_0,           group: scheme,  source: quantize, type: Q4_0}
      # DIY imatrix twins, own digit-free calibration (H4)
      - {name: Q4_K_M_imat,    group: imatrix, source: quantize, type: Q4_K_M,  imatrix: own}
      - {name: Q3_K_M_imat,    group: imatrix, source: quantize, type: Q3_K_M,  imatrix: own}
      - {name: Q2_K_imat,      group: imatrix, source: quantize, type: Q2_K,    imatrix: own}
      - {name: IQ4_XS,         group: imatrix, source: quantize, type: IQ4_XS,  imatrix: own}
      - {name: IQ3_XXS,        group: imatrix, source: quantize, type: IQ3_XXS, imatrix: own}
      - {name: IQ2_XS,         group: imatrix, source: quantize, type: IQ2_XS,  imatrix: own}
      # stock recipe + unsloth's imatrix: separates their calibration from their recipe
      - {name: Q4_K_M_usimat,  group: usimat,  source: quantize, type: Q4_K_M,  imatrix: unsloth}
      - {name: Q3_K_M_usimat,  group: usimat,  source: quantize, type: Q3_K_M,  imatrix: unsloth}

      # unsloth prequantized: what people actually run
      - {name: us_Q8_0,        group: unsloth, source: hf, file: Qwen3.5-4B-Q8_0.gguf}
      - {name: us_Q6_K,        group: unsloth, source: hf, file: Qwen3.5-4B-Q6_K.gguf}
      - {name: us_Q5_K_M,      group: unsloth, source: hf, file: Qwen3.5-4B-Q5_K_M.gguf}
      - {name: us_Q4_K_M,      group: unsloth, source: hf, file: Qwen3.5-4B-Q4_K_M.gguf}
      - {name: us_Q4_0,        group: unsloth, source: hf, file: Qwen3.5-4B-Q4_0.gguf}
      - {name: us_IQ4_XS,      group: unsloth, source: hf, file: Qwen3.5-4B-IQ4_XS.gguf}
      - {name: us_Q3_K_M,      group: unsloth, source: hf, file: Qwen3.5-4B-Q3_K_M.gguf}
      - {name: us_UD-Q4_K_XL,  group: unsloth, source: hf, file: Qwen3.5-4B-UD-Q4_K_XL.gguf}
      - {name: us_UD-Q3_K_XL,  group: unsloth, source: hf, file: Qwen3.5-4B-UD-Q3_K_XL.gguf}
      - {name: us_UD-Q2_K_XL,  group: unsloth, source: hf, file: Qwen3.5-4B-UD-Q2_K_XL.gguf}
      - {name: us_UD-IQ3_XXS,  group: unsloth, source: hf, file: Qwen3.5-4B-UD-IQ3_XXS.gguf}
      - {name: us_UD-IQ2_XXS,  group: unsloth, source: hf, file: Qwen3.5-4B-UD-IQ2_XXS.gguf}

  # Phase 2: unsloth files plus a plain no-imatrix ladder for the size comparison (H5).
  # The imatrix/recipe breakdown (H4) was answered on the 4B and is not repeated.
  qwen3.5-9b:
    hf_repo: unsloth/Qwen3.5-9B-GGUF
    reference: BF16
    unsloth_imatrix: imatrix_unsloth.gguf_file
    skip_exps: [E4]                 # superseded by E4b (see PLAN.md)
    e0_variants: [BF16, us_Q8_0]    # no DIY Q8_0 in this set
    variants:
      - {name: BF16,           group: reference, source: hf, file: Qwen3.5-9B-BF16.gguf}

      # DIY ladder, no imatrix (H1, H5)
      - {name: Q6_K,           group: ladder,  source: quantize, type: Q6_K}
      - {name: Q5_K_M,         group: ladder,  source: quantize, type: Q5_K_M}
      - {name: Q4_K_M,         group: ladder,  source: quantize, type: Q4_K_M}
      - {name: Q3_K_M,         group: ladder,  source: quantize, type: Q3_K_M}
      - {name: Q2_K,           group: ladder,  source: quantize, type: Q2_K}
      # the one place an imatrix changed everything on the 4B
      - {name: Q2_K_imat,      group: imatrix, source: quantize, type: Q2_K,    imatrix: own}

      # unsloth prequantized
      - {name: us_Q8_0,        group: unsloth, source: hf, file: Qwen3.5-9B-Q8_0.gguf}
      - {name: us_Q6_K,        group: unsloth, source: hf, file: Qwen3.5-9B-Q6_K.gguf}
      - {name: us_Q5_K_M,      group: unsloth, source: hf, file: Qwen3.5-9B-Q5_K_M.gguf}
      - {name: us_Q4_K_M,      group: unsloth, source: hf, file: Qwen3.5-9B-Q4_K_M.gguf}
      - {name: us_Q4_0,        group: unsloth, source: hf, file: Qwen3.5-9B-Q4_0.gguf}
      - {name: us_IQ4_XS,      group: unsloth, source: hf, file: Qwen3.5-9B-IQ4_XS.gguf}
      - {name: us_Q3_K_M,      group: unsloth, source: hf, file: Qwen3.5-9B-Q3_K_M.gguf}
      - {name: us_UD-Q4_K_XL,  group: unsloth, source: hf, file: Qwen3.5-9B-UD-Q4_K_XL.gguf}
      - {name: us_UD-Q3_K_XL,  group: unsloth, source: hf, file: Qwen3.5-9B-UD-Q3_K_XL.gguf}
      - {name: us_UD-Q2_K_XL,  group: unsloth, source: hf, file: Qwen3.5-9B-UD-Q2_K_XL.gguf}
      - {name: us_UD-IQ3_XXS,  group: unsloth, source: hf, file: Qwen3.5-9B-UD-IQ3_XXS.gguf}
      - {name: us_UD-IQ2_XXS,  group: unsloth, source: hf, file: Qwen3.5-9B-UD-IQ2_XXS.gguf}

  qwen3.8-27b:
    hf_repo: unsloth/Qwen3.8-27B-GGUF
    # BF16 (54.7 GB) does not fit in 2 x 24 GB, so unsloth's Q8_0 is the reference and spans
    # both GPUs; DIY quants are made from the BF16, which is deleted after the last of them
    reference: us_Q8_0
    quant_source: [BF16/Qwen3.8-27B-BF16-00001-of-00002.gguf, BF16/Qwen3.8-27B-BF16-00002-of-00002.gguf]
    skip_exps: [E4]                 # superseded by E4b (see PLAN.md)
    e0_variants: [us_Q8_0, Q6_K]
    # a 22-29 GB file mmapped on a 30 GB host starves the page cache and triggers the OOM killer;
    # without mmap the weights are read straight into VRAM (same numbers, smaller host RSS)
    mmap: false
    variants:
      - {name: us_Q8_0,        group: reference, source: hf, file: Qwen3.8-27B-Q8_0.gguf}

      # DIY ladder, no imatrix (H1, H5); Q6_K also spans both GPUs
      - {name: Q6_K,           group: ladder,  source: quantize, type: Q6_K}
      - {name: Q5_K_M,         group: ladder,  source: quantize, type: Q5_K_M}
      - {name: Q4_K_M,         group: ladder,  source: quantize, type: Q4_K_M}
      - {name: Q3_K_M,         group: ladder,  source: quantize, type: Q3_K_M}
      - {name: Q2_K,           group: ladder,  source: quantize, type: Q2_K}
      # imatrix computed from the Q8_0 reference (BF16 does not fit in VRAM)
      - {name: Q2_K_imat,      group: imatrix, source: quantize, type: Q2_K,    imatrix: own}

      # unsloth prequantized; for the 27B every K-quant file is an unsloth dynamic (UD) mix
      - {name: us_UD-Q6_K,     group: unsloth, source: hf, file: Qwen3.8-27B-UD-Q6_K.gguf}
      - {name: us_UD-Q5_K_M,   group: unsloth, source: hf, file: Qwen3.8-27B-UD-Q5_K_M.gguf}
      - {name: us_UD-Q4_K_XL,  group: unsloth, source: hf, file: Qwen3.8-27B-UD-Q4_K_XL.gguf}
      - {name: us_UD-Q4_K_M,   group: unsloth, source: hf, file: Qwen3.8-27B-UD-Q4_K_M.gguf}
      - {name: us_Q4_0,        group: unsloth, source: hf, file: Qwen3.8-27B-Q4_0.gguf}
      - {name: us_UD-IQ4_XS,   group: unsloth, source: hf, file: Qwen3.8-27B-UD-IQ4_XS.gguf}
      - {name: us_UD-Q3_K_XL,  group: unsloth, source: hf, file: Qwen3.8-27B-UD-Q3_K_XL.gguf}
      - {name: us_UD-IQ3_XXS,  group: unsloth, source: hf, file: Qwen3.8-27B-UD-IQ3_XXS.gguf}
      - {name: us_UD-Q2_K_XL,  group: unsloth, source: hf, file: Qwen3.8-27B-UD-Q2_K_XL.gguf}
      - {name: us_UD-IQ2_XXS,  group: unsloth, source: hf, file: Qwen3.8-27B-UD-IQ2_XXS.gguf}
